<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500: Internal Server Error</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/pages/error.css') }}">
</head>
<body>

    <!-- reusable error containers -->
    <div class="error-container">
        <div class="error-code">500</div>
        <div class="error-title">Internal Server Error</div>
        <div class="error-message">
            Something went wrong on our end. We’re working to fix it. Please try reloading the page or check back later.
        </div>
        <button class="error-button" onclick="window.location.href='/map'">
            Go to Map
        </button>
    </div>

</body>
</html>

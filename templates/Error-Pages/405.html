<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>405: Method not allowed</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/pages/error.css') }}">
</head>
<body>

    <!-- reusable error containers -->

        <div class="error-code">405</div>
        <div class="error-title">Method not allowed</div>

    </div>

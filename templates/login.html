<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_page.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
    <div id="login_screen" style="display : flex">
        <div id="login_items">
            <div class="login_field">
                <label id="login_validation_label"></label>
            </div>
            <div class="login_field">
                <label class="entry-label" for="login_username_entry">Username</label>
                <input type="text" id="login_username_entry" placeholder="enter username">
            </div>
                <div class="login_field">
                <label class="entry-label" for="login_password_entry">Password</label>
                <input type="password" id="login_password_entry" placeholder="enter password">
                <i class="fa-solid fa-eye"></i>
            </div>
            <button id="login_button" class="generate-button">Login</button>
        </div>
        <div id="switch_to_register_container">
            <label for="switch_to_register_button" id="switch_to_register_lable">Don't have an account ? Register below</label>
            <button id="switch_to_register_button" class="generate-button">Register</button>
        </div>
    </div>
</body>
<script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
</html>

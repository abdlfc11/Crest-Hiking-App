<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register_page.css')}}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="register-go-back-button-container">
        <button id="register-go-back-button" class="generate-button">Go Back</button>
    </div>
    <div id="register-screen">
        <div id="register-items-and-button">
            <div id="register-items">
                <div class="register-field">
                    <label id="register-validation-label"></label>
                </div>
                <div class="register-field">
                    <label for="register-username-entry">Username</label>
                    <input type="text" id="register-username-entry" placeholder="enter username">
                </div>
                <div class="register-field">
                    <label for="register-password-entry1">Password</label>
                    <input type="password" id="register-password-entry1" placeholder="enter password">
                    <i id="register-eye" class="fa-solid fa-eye"></i>
                </div>
                <div class="register-field">
                    <label for="register-password-entry2">Enter Password again</label>
                    <input type="password" id="register-password-entry2" placeholder="enter password again">
                    <i id="register-eye" class="fa-solid fa-eye"></i>
                </div>
            </div>
            <button type="button" id="register-button" class="generate-button">Register</button>
        </div>
    </div>
</body>
<script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
    const apiRegisterUrl = "{{ url_for('registering') }}";
</script>
</html>

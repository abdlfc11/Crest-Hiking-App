services:
  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    command: flask run --host=0.0.0.0
    volumes:
      - ./app.py:/app/app.py
      - ./pathfinder.py:/app/pathfinder.py
      - ./config.py:/app/config.py
      - ./templates:/app/templates
      - ./static:/app/static
      - ./Pathfinding/better_path_graph.pkl:/app/Pathfinding/better_path_graph.pkl:ro
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
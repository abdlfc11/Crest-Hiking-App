services:
  db:
    image: postgres:15
    env_file:
      - path: example.env
        required: true
      - path: .env
        required: false
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"] 
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    command: flask run --host=0.0.0.0 --port=5000 --debug 
    volumes:
      # this mounts the entire src (backend python flask / FastAPI) folder
      - ./src:/app/src

      # this mounts other important folders
      - ./templates:/app/templates
      - ./static:/app/static
      - ./migrations:/app/migrations
      - ./Pathfinding:/app/Pathfinding
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=1
      - LOAD_GRAPH_ON_IMPORT=0 
      - FLASK_ENV=development
      - PYTHONPATH=/app/src
    ports:
      - "5000:5000"
    env_file:
      - path: example.env
        required: true
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: